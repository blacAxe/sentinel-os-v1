apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\k8s\kompose.exe convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: topic-init
  name: topic-init
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: topic-init
  template:
    metadata:
      annotations:
        kompose.cmd: C:\k8s\kompose.exe convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: topic-init
    spec:
      containers:
        - command:
            - /bin/sh
            - -c
            - ' rpk topic create logs-raw --brokers=redpanda:9092; rpk topic create security-events --brokers=redpanda:9092; '
          image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
          name: topic-init
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
