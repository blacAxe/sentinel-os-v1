apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\k8s\kompose.exe convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: agent
  name: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: agent
  template:
    metadata:
      annotations:
        kompose.cmd: C:\k8s\kompose.exe convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: agent
    spec:
      containers:
        - env:
            - name: KAFKA_BROKERS
              value: redpanda:9092
          image: sentinel-platform-v1-agent
          name: lumen-agent
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7777
              protocol: TCP
      restartPolicy: Always
