apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\k8s\kompose.exe convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: vortex
  name: vortex
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: vortex
  template:
    metadata:
      annotations:
        kompose.cmd: C:\k8s\kompose.exe convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: vortex
    spec:
      containers:
        - name: vortex # <--- This was the missing line!
          image: sentinel-platform-v1-vortex
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:5432/sentinel
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
          livenessProbe:
            exec:
              command:
                - wget
                - --spider
                - -q
                - http://localhost:8080/actuator/health
            failureThreshold: 10
            periodSeconds: 10
            timeoutSeconds: 5
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always