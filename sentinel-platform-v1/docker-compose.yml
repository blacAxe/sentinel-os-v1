services:

  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sentinel-net

  idp:
    build: ./zero-trust-idp
    container_name: idp
    ports:
      - "8080:8080"
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/sentinel?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    build: ./sentinel-proxy
    container_name: sentinel-proxy
    ports:
      - "8081:8081"
    environment:
      - IDP_URL=http://idp:8080
      - TARGET_URL=http://idp:8080
      - VORTEX_URL=http://vortex:8080
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
    depends_on:
      idp:
        condition: service_healthy
    networks:
      - sentinel-net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 10s
      timeout: 10s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: lumen_db
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: lumenlog2026
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./lumenlog/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sentinel-net

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    depends_on:
      redpanda:   
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      rpk topic create logs-raw --brokers=redpanda:9092;
      rpk topic create security-events --brokers=redpanda:9092;
      "
    networks:
      - sentinel-net

  ingestor:
    build:
      context: ./lumenlog
      dockerfile: ./cmd/ingestor/Dockerfile
    container_name: lumen-ingestor
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_started
      topic-init:
        condition: service_completed_successfully
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_DB=lumen_db
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=lumenlog2026
    networks:
      - sentinel-net

  alerter:
    build:
      context: ./lumenlog
      dockerfile: ./cmd/alerter/Dockerfile
    container_name: lumen-alerter
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
    networks:
      - sentinel-net

  agent:
    build:
      context: ./lumenlog
      dockerfile: ./agent/Dockerfile
    container_name: lumen-agent
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      - KAFKA_BROKERS=redpanda:9092
    ports:
      - "7777:7777"
    networks:
      - sentinel-net

  vortex:
    build: ./vortex-java
    container_name: vortex
    ports:
      - "8090:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/sentinel
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  sentinel-net:
    driver: bridge
    name: sentinel-net

volumes:
  postgres_data:
  clickhouse_data: